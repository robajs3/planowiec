{% extends "base.html" %}
{% block title %}Logowanie · Planowiec{% endblock %}
{% block guest_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">🗓️</span> Planowiec
    </div>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label class="form-label" for="identifier">Nazwa użytkownika lub e-mail</label>
        <input class="form-control" type="text" id="identifier" name="identifier" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Hasło</label>
        <input class="form-control" type="password" id="password" name="password" required>
      </div>
      <div class="form-group checkbox-row">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember" style="font-size:.85rem;">Zapamiętaj mnie</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Zaloguj się</button>
    </form>
    <div class="auth-footer">
      Nie masz konta? <a href="{{ url_for('auth.register') }}">Zarejestruj się</a>
    </div>
  </div>
</div>
{% endblock %}
